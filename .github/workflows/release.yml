name: Release

# Publishes the package to GitHub Packages from a v* tag on main. No caches: a
# tag run must not restore a cache that a PR run wrote.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IBM_TELEMETRY_DISABLED: 'true'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  # The same checks as the release checks, without write permissions.
  verify:
    # Only the public repo publishes; forks never do.
    if: github.repository == 'afframe/ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the version and points to main
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
      - run: pnpm exec playwright install chromium --only-shell
      # CI is set, so this includes the visual project.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pack
      # check:pack inspects npm's pack, so publish uploads that one; pnpm pack
      # would also ship the LICENSE symlink. Publish runs no build code.
      - run: mv "$(npm pack --ignore-scripts --silent)" package.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package.tgz
          if-no-files-found: error

  publish:
    needs: verify
    if: github.repository == 'afframe/ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewer on the release environment, set in the repo settings.
    environment: release
    permissions:
      contents: read
      packages: write # upload to GitHub Packages
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@afframe'
      # GitHub Packages has no trusted publishing; it takes the job token.
      - run: npm publish package.tgz # zizmor: ignore[use-trusted-publishing]
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
