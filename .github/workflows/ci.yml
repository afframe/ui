name: CI

# No path filters: the `ci` job is the required check. Heavy checks run in release-checks.yml.
on:
  pull_request:
    # `edited`: a new title is checked again.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IBM_TELEMETRY_DISABLED: 'true'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          image="$(sed -n 's/^FROM \(.*\) AS gitleaks$/\1/p' scripts/ci/toolbox/Dockerfile)"
          # The config comes from the base branch, and a PR may not add a .gitleaksignore
          # (gitleaks reads it from the scanned tree): a PR must not allowlist its own secret.
          if [ -n "$GITHUB_BASE_REF" ]; then
            git show "origin/$GITHUB_BASE_REF:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
            if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep -qx .gitleaksignore; then
              echo "::error::.gitleaksignore changes are reviewed outside CI"
              exit 1
            fi
          else
            cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          fi
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/gitleaks.toml:/gitleaks.toml:ro" "$image" git --config /gitleaks.toml --no-banner --redact /repo

  # The squash merge uses the PR title as the commit subject: Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert|style)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          [[ "$TITLE" =~ $pattern ]] && exit 0
          echo "::error::PR title must follow Conventional Commits, e.g. 'feat: add Tile'. Got: '$TITLE'"
          exit 1

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          image="$(sed -n 's/^FROM \(.*\) AS actionlint$/\1/p' scripts/ci/toolbox/Dockerfile)"
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" -color
      - name: zizmor
        run: |
          image="$(sed -n 's/^FROM \(.*\) AS zizmor$/\1/p' scripts/ci/toolbox/Dockerfile)"
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" --offline --no-progress .

  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
      - run: pnpm build
      - run: pnpm check:pack
      - name: reuse lint and licence labels
        run: scripts/ci/licence-check.sh

  docgen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docgen server is experimental: a Storybook update can empty the
      # Carbon and IBM Products API tables without failing the build.
      - run: pnpm build:storybook
      - run: pnpm check:docgen

  # Two shards keep the job fast. Visual tests run in release-checks.yml.
  test:
    name: test (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No-op when the cache already holds this browser build.
      - run: pnpm exec playwright install chromium --only-shell
      - run: pnpm build:css
      - env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec vitest run --project node --project unit --project storybook --shard="$SHARD/2"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-attachments-${{ matrix.shard }}
          path: .vitest/attachments
          retention-days: 7
          if-no-files-found: ignore

  # The required check: fails when a job above failed or was cancelled.
  # pr-title is skipped on pushes to main.
  ci:
    if: always()
    needs: [secrets, pr-title, workflow-lint, preflight, docgen, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e 'to_entries | all(.value.result == "success" or (.key == "pr-title" and .value.result == "skipped"))' <<< "$NEEDS" > /dev/null && exit 0
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          echo "::error::A required job did not pass."
          exit 1
