name: Feature
description: Propose a component, export or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should the package do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does an app need that it cannot do today?
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
  - type: textarea
    id: design
    attributes:
      label: Design
      description: Carbon components, props, messages, server or client.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests, stories or checks that prove it works.
