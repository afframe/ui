# gitleaks rules for the secrets job in .github/workflows/ci.yml: upstream defaults plus Anthropic keys and Czech identifiers.
[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\bsk-ant-(api|admin)\d{2}-[A-Za-z0-9_\-]{60,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "czech-iban"
description = "Czech IBAN"
regex = '''\bCZ\d{2} ?(?:\d{4} ?){4}\d{4}\b'''
keywords = ["cz"]

[[rules]]
id = "czech-vat-dic"
description = "Czech VAT number (DIC)"
regex = '''\bCZ\d{8,10}\b'''
keywords = ["cz"]

[[rules]]
id = "czech-ico"
description = "Czech business ID (ICO) after its label"
regex = '''(?i)\bi[čc]o\s*[:=]\s*\d{8}\b'''
keywords = ["ico", "ičo"]

[[rules]]
id = "czech-birth-number"
description = "Czech birth number"
regex = '''\b\d{6}/\d{3,4}\b'''

# Fake values in tests and stories: a placeholder VAT number and a test API key.
[[allowlists]]
description = "Fake fixtures in tests and stories"
regexes = ['''^CZ12345678$''', '''^ak_live_9f8e7d6c5b4a$''']
